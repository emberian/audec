[package]
name = "audec"
version = "0.2.0"
edition = "2021"

[lib]
name = "audec"
path = "src/lib.rs"

[features]
default = []
# The real model runtime remains an opt-in worker target. The GPUI application,
# protocol tests, and model registry do not compile RTen unless requested.
beat-this-rten-worker = ["dep:beat-this"]
# MIDI 1 device I/O is isolated because native backends have platform-specific
# build/runtime requirements. The default GPUI build remains dependency-neutral.
midi-input = ["dep:midir", "dep:rtrb", "dep:wmidi"]
# Direct device ownership is opt-in; enabling it selects CPAL behind the same
# application host instead of opening Rodio alongside it. CPAL is pinned to
# Rodio 0.22.2's exact line so both build modes retain one compatible platform
# type universe.
cpal-device = ["dep:cpal"]
# Vello remains an explicit surface-by-surface experiment. The default native
# UI uses GPUI's renderer, so ordinary Audec builds do not pull in a second GPU
# stack merely to use the toolkit's audio controls.
ui-vello = ["gpui-audio-kit/vello", "d3rs/vello-gpui"]

[[bin]]
name = "audec-beat-this-worker"
path = "src/bin/audec-beat-this-worker.rs"
required-features = ["beat-this-rten-worker"]

[[bin]]
name = "audec-midi-inspect"
path = "src/bin/audec-midi-inspect.rs"
required-features = ["midi-input"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
# MIT OR Apache-2.0. One-shot product completions cross from Audec's bounded
# analysis workers back into GPUI without parking an executor thread.
async-channel = "2"
# Exact audited source; model graphs are separately user-installed and hashed.
beat-this = { git = "https://github.com/danigb/beat-this-rs.git", rev = "089b509247e6fdcec666511c0dcf0d5f39c21e73", optional = true, default-features = false }
claxon = "0.4"
clack-host = "0.1.1"
clack-common = "0.1.1"
clack-extensions = { version = "0.1.1", features = ["clack-host", "audio-ports", "latency", "note-ports", "params", "render", "state", "tail"] }
cpal = { version = "=0.17.3", optional = true, default-features = false }
dirs = "6"
shared_memory = "0.12.4"
# Audec owns this single, namespaced GPUI/platform universe. Guise is pinned to
# the matching fork so its public GPUI types cannot drift from the app's.
gpui = { package = "gpui-toolkit-gpui", git = "https://github.com/emberian/gpui-toolkit.git", rev = "8ea60d1bfb1816a19871d1c97d0090166a3ea105" }
gpui-miniapp = { git = "https://github.com/emberian/gpui-toolkit.git", rev = "8ea60d1bfb1816a19871d1c97d0090166a3ea105", default-features = false }
gpui-audio-kit = { package = "gpui-audio-kit", git = "https://github.com/emberian/gpui-toolkit.git", rev = "8ea60d1bfb1816a19871d1c97d0090166a3ea105", default-features = false }
d3rs = { package = "gpui-d3rs", git = "https://github.com/emberian/gpui-toolkit.git", rev = "8ea60d1bfb1816a19871d1c97d0090166a3ea105", default-features = false, features = ["gpui"] }
guise-ui = { git = "https://github.com/emberian/guise.git", rev = "cae644437b854bdfd9d35c685458611c0c08ed65", default-features = false }
# MIT. Native MIDI 1 backend; optional so ordinary/headless builds do not need
# ALSA/CoreMIDI/WinMM support or device permissions.
# Exact audited pre-release commit: this has 0.11's ALSA range (compatible with
# Rodio/CPAL) while retaining CoreMIDI 0.8 (compatible with GPUI 0.2.2's exact
# core-foundation 0.10.0 pin). Published 0.10.3 conflicts on Linux and published
# 0.11.0 conflicts on macOS in this dependency graph.
midir = { git = "https://github.com/Boddlnagg/midir.git", rev = "3406042797e190ae5985e84bbedbc2d475325272", optional = true }
png = "0.18"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "wav", "vorbis", "mp3"] }
# MIT OR Apache-2.0. Sinc conversion is used without the optional FFT stack.
rubato = { version = "5.0.0", default-features = false }
# MIT OR Apache-2.0. Bounded SPSC transport from MIDI callbacks to control.
rtrb = { version = "=0.4.0", optional = true }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MPL-2.0. Keep this exact line coordinated with Rodio 0.22.2 so only one
# Symphonia version supplies decode support.
symphonia = { version = "=0.5.5", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# MIT. Allocation-free typed validation for bounded MIDI 1 channel packets.
wmidi = { version = "=4.0.11", optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Patches declared by git dependencies do not propagate into this root graph.
# Keep this family identical to the toolkit fork's WGPU pin so enabling Vello
# cannot resolve a second, type-incompatible GPU universe.
[patch.crates-io]
wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-core = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-hal = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-types = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
naga = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
