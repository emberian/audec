[package]
name = "audec"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
claxon = "0.4"
gpui = "0.2.2"
guise-ui = { version = "=1.5.3", default-features = false }
png = "0.18"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "wav", "vorbis", "mp3"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
